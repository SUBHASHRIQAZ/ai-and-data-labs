name: Agent task
description: A feature or fix that Claude can implement. Add the `claude:implement` label to start.
title: "[Task]: "
labels: ["agent-task"]
body:
  - type: input
    id: project
    attributes:
      label: Project folder
      description: Top-level folder this change belongs to.
      placeholder: ridepulse-databricks
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements — each becomes at least one test.
      placeholder: |
        - [ ] Trips with fare_amount < 0 are dropped in silver
        - [ ] A data-quality metric counts dropped rows
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / pointers
      description: Relevant files, functions, tables, links.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
