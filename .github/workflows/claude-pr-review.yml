# AI review on every PR: a code review (pr-reviewer agent) and a security review
# (security-reviewer agent), posted as inline + summary comments.
name: Claude · PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Require ANTHROPIC_API_KEY
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Load instructions from the base branch so a PR can't rewrite its own reviewer.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _base
          sparse-checkout: ai-pr-agents

      - name: Load agent instructions
        run: |
          src=_base/ai-pr-agents/claude
          [ -d "$src" ] || src=ai-pr-agents/claude   # first PR that adds the folder
          mkdir -p .claude && cp -r "$src"/. .claude/ && rm -rf _base

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Use the `review-pr` skill to review this pull request. Focus on correctness,
            unmet acceptance criteria and missing tests. Skip style (ruff runs in CI)
            and security (a separate job covers it).
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Task,Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

  security-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Require ANTHROPIC_API_KEY
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _base
          sparse-checkout: ai-pr-agents

      - name: Load agent instructions
        run: |
          mkdir -p .claude
          if [ -d _base/ai-pr-agents/claude ]; then
            cp -r _base/ai-pr-agents/claude/. .claude/
            # keep trusted scanner config from base too
            rm -rf ai-pr-agents/config && cp -r _base/ai-pr-agents/config ai-pr-agents/config
          else
            cp -r ai-pr-agents/claude/. .claude/   # first PR that adds the folder
          fi
          rm -rf _base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        run: pip install -q bandit pip-audit

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}

            Run the `security-check` skill against this PR's changes (use BASE instead of
            origin/main), then have the `security-reviewer` agent triage the results and
            review the diff. Post confirmed vulnerabilities as inline comments and one
            summary comment titled "## 🔒 Claude security review". If nothing is found,
            post a one-line summary saying so. Do not modify files.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Task,Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(bandit:*),Bash(pip-audit:*),Bash(grep:*)"
