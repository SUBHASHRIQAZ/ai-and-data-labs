# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS DOES
#   When a pull request is opened or updated, Claude reviews it twice:
#     • code-review     → runs the /review command          (bugs, missing tests)
#     • security-review → runs the /security-review command (vulnerabilities, secrets)
#   Results appear as comments on the PR.
#
# WHERE THE INSTRUCTIONS ARE
#   ai-pr-agents/claude/commands/review.md           ← what the /review command does
#   ai-pr-agents/claude/commands/security-review.md
#   ai-pr-agents/claude/skills/ , agents/ , instructions/
#
# NEEDS: the ANTHROPIC_API_KEY repo secret and the Claude GitHub App installed.
# ─────────────────────────────────────────────────────────────────────────────
name: Claude · PR review

# WHEN to run: a PR is opened, gets new commits, is reopened, or leaves draft.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# If you push again while a review is running, cancel the old one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    if: github.event.pull_request.draft == false   # skip draft PRs
    runs-on: ubuntu-latest                          # a fresh Linux machine from GitHub
    timeout-minutes: 20
    permissions:            # what this job may do on GitHub
      contents: read        #   read the code (can't push)
      pull-requests: write  #   post review comments
      issues: read          #   read the linked issue
      id-token: write       #   log in as the Claude GitHub App
    steps:
      # 1. Stop early with a clear message if the API key secret is missing.
      - name: Require ANTHROPIC_API_KEY
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # 2. Download the PR's code onto the machine (full history, so git diff works).
      - name: Check out the PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. Also download ai-pr-agents/ from main into _base/. The reviewer's
      #    instructions come from main, so a PR can't change its own reviewer.
      - name: Check out trusted instructions from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _base
          sparse-checkout: ai-pr-agents

      # 4. Copy the instructions into .claude/, where Claude Code looks for them.
      - name: Load Claude instructions, commands, skills and agents
        run: |
          src=_base/ai-pr-agents/claude
          [ -d "$src" ] || src=ai-pr-agents/claude   # first PR that adds the folder
          mkdir -p .claude && cp -r "$src"/. .claude/ && rm -rf _base

      # 5. Run Claude Code with the /review command.
      - name: Claude reviews the PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true          # shows a live progress comment on the PR
          prompt: |
            REPO: ${{ github.repository }}

            Run the /review command for PR ${{ github.event.pull_request.number }}.
            Its instructions are in .claude/commands/review.md.
          # --model:        which Claude model to use
          # --max-turns:    upper limit on steps, which caps cost
          # --allowedTools: the only tools Claude may use. No Edit/Write, so it can't change code.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Task,Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

  security-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Require ANTHROPIC_API_KEY
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Check out the PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out trusted instructions from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _base
          sparse-checkout: ai-pr-agents

      # Same as above, plus the scanner settings (ruff/bandit) also come from main.
      - name: Load Claude instructions and scanner config
        run: |
          mkdir -p .claude
          if [ -d _base/ai-pr-agents/claude ]; then
            cp -r _base/ai-pr-agents/claude/. .claude/
            rm -rf ai-pr-agents/config && cp -r _base/ai-pr-agents/config ai-pr-agents/config
          else
            cp -r ai-pr-agents/claude/. .claude/   # first PR that adds the folder
          fi
          rm -rf _base

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security scanners
        run: pip install -q bandit pip-audit

      - name: Claude security-reviews the PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}

            Run the /security-review command for PR ${{ github.event.pull_request.number }}
            with base branch origin/${{ github.base_ref }}.
            Its instructions are in .claude/commands/security-review.md.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Task,Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(bandit:*),Bash(pip-audit:*),Bash(grep:*)"
