bundle:
  name: dab_tutorial
  uuid: 3721fac3-268c-4b29-8f53-deff26e72884

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: dbc-2a39b143-27d8.cloud.databricks.com
    permissions:
      - group_name: admins
        level: CAN_MANAGE
    presets:
      name_prefix: ${workspace.current_user.short_name}
      source_linked_deployment: false 
  prod:
    mode: production
    workspace:
      host: dbc-2a39b143-27d8.cloud.databricks.com
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: subhashridash@gmail.com
        level: CAN_MANAGE
      - group_name: admins
        level: CAN_RUN
